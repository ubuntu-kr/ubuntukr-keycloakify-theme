# Account console v3 (Keycloak 25+). Everything is inherited from the parent
# theme except the logo, the favicon and a small font override.
parent=keycloak.v3

# Logo in the upper left corner and the link followed when clicking on it
logo=/public/logo.svg
logoUrl=./

favIcon=/public/favicon.ico
favIconType=image/x-icon

styles=css/styles-v3.css
