<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" href="/favicon.ico" />
        <title>Single Sign On</title>

        <link rel="preload" href="/fonts/Ubuntu/Ubuntu-R.ttf" as="font" type="font/ttf" crossorigin="anonymous" />
        <link rel="preload" href="/fonts/Ubuntu/Ubuntu-Th.ttf" as="font" type="font/ttf" crossorigin="anonymous" />

        <!-- The fonts live in public/ and are declared here so that they are available on every page of the theme. -->
        <style>
            @font-face {
                font-family: "Ubuntu";
                font-style: normal;
                font-weight: bold;
                font-display: swap;
                src: url("/fonts/Ubuntu/Ubuntu-B.ttf") format("truetype");
            }

            @font-face {
                font-family: "Ubuntu";
                font-style: italic;
                font-weight: bold;
                font-display: swap;
                src: url("/fonts/Ubuntu/Ubuntu-BI.ttf") format("truetype");
            }

            @font-face {
                font-family: "Ubuntu";
                font-style: normal;
                font-weight: lighter;
                font-display: swap;
                src: url("/fonts/Ubuntu/Ubuntu-L.ttf") format("truetype");
            }

            @font-face {
                font-family: "Ubuntu";
                font-style: italic;
                font-weight: lighter;
                font-display: swap;
                src: url("/fonts/Ubuntu/Ubuntu-LI.ttf") format("truetype");
            }

            @font-face {
                font-family: "Ubuntu";
                font-style: normal;
                font-weight: 500;
                font-display: swap;
                src: url("/fonts/Ubuntu/Ubuntu-M.ttf") format("truetype");
            }

            @font-face {
                font-family: "Ubuntu";
                font-style: italic;
                font-weight: 500;
                font-display: swap;
                src: url("/fonts/Ubuntu/Ubuntu-MI.ttf") format("truetype");
            }

            @font-face {
                font-family: "Ubuntu";
                font-style: normal;
                font-weight: normal;
                font-display: swap;
                src: url("/fonts/Ubuntu/Ubuntu-R.ttf") format("truetype");
            }

            @font-face {
                font-family: "Ubuntu";
                font-style: italic;
                font-weight: normal;
                font-display: swap;
                src: url("/fonts/Ubuntu/Ubuntu-RI.ttf") format("truetype");
            }

            @font-face {
                font-family: "Ubuntu";
                font-style: normal;
                font-weight: 100;
                font-display: swap;
                src: url("/fonts/Ubuntu/Ubuntu-Th.ttf") format("truetype");
            }
        </style>
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
